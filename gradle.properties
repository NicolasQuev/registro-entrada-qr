# Propiedades de Gradle del proyecto Registro de Entrada.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX obligatorio para Jetpack Compose, Room, DataStore, Hilt.
android.useAndroidX=true

# Estilo oficial de Kotlin.
kotlin.code.style=official

# R class no transitivo: clases más pequeñas y builds más rápidos.
android.nonTransitiveRClass=true

# El proyecto usa compileSdk 36 con AGP 8.13.0.
android.suppressUnsupportedCompileSdk=36

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
