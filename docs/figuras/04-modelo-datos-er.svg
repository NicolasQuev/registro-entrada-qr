idad y notación</text><text x="90" y="952" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12" fill="#1A1A1A" font-weight="normal" text-anchor="start">· Cardinalidad 1 : N — una fila de la tabla padre admite muchas filas de la tabla hija;</text><text x="90" y="971" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12" fill="#1A1A1A" font-weight="normal" text-anchor="start">  la flecha apunta siempre a la tabla hija (eventos → entradas, entradas → registros_acceso).</text><text x="90" y="990" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12" fill="#1A1A1A" font-weight="normal" text-anchor="start">· Claves foráneas con acción explícita: CASCADE (datos que no tienen sentido solos),</text><text x="90" y="1009" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12" fill="#1A1A1A" font-weight="normal" text-anchor="start">  RESTRICT (tipo de entrada y operador con historial), SET NULL (entrada desconocida).</text><text x="90" y="1028" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12" fill="#1A1A1A" font-weight="normal" text-anchor="start">· El aforo ocupado se calcula con COUNT sobre registros_acceso (resultado = PERMITIDO).</text><text x="90" y="1047" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12" fill="#1A1A1A" font-weight="normal" text-anchor="start">· registros_acceso es inmutable: los DAOs solo exponen INSERT y SELECT (RN-08).</text><rect x="1000" y="900" width="520" height="152" rx="10" ry="10" fill="#FFF9F4" stroke="#A65B00" stroke-width="1.6" opacity="1.0"/><text x="1020" y="928" font-family="DejaVu Sans, Verdana, sans-serif" font-size="14" fill="#A65B00" font-weight="bold" text-anchor="start">Fuera de la base de datos (DataStore)</text><text x="1020" y="952" font-family="DejaVu Sans, Verdana, sans-serif" font-size="11.5" fill="#1A1A1A" font-weight="normal" text-anchor="start">· operador_activo_id · operador_activo_nombre</text><text x="1020" y="973" font-family="DejaVu Sans, Verdana, sans-serif" font-size="11.5" fill="#1A1A1A" font-weight="normal" text-anchor="start">· evento_activo_id · puerta_activa · tema_app</text><text x="1020" y="994" font-family="DejaVu Sans, Verdana, sans-serif" font-size="11.5" fill="#1A1A1A" font-weight="normal" text-anchor="start">· sonido_escaneo · vibracion_escaneo</text><text x="1020" y="1015" font-family="DejaVu Sans, Verdana, sans-serif" font-size="11.5" fill="#1A1A1A" font-weight="normal" text-anchor="start">· intentos_pin_fallidos · bloqueo_hasta · ultimo_respaldo</text></svg>