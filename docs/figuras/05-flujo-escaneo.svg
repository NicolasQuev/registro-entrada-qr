<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000"><defs><marker id="ar-azul" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1F3864"/></marker><marker id="ar-azul2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2E74B5"/></marker><marker id="ar-verde" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1E6B34"/></marker><marker id="ar-rojo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#B3261E"/></marker><marker id="ar-naranja" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#A65B00"/></marker><marker id="ar-gris" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9AA5B1"/></marker><marker id="ar-morado" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5B2C6F"/></marker></defs><rect x="0" y="0" width="1400" height="1000" fill="#FFFFFF"/><text x="700.0" y="38" font-family="DejaVu Sans, Verdana, sans-serif" font-size="24" fill="#1F3864" font-weight="bold" text-anchor="middle">Flujo de validación de un escaneo en la puerta (secuencia)</text><rect x="20" y="70" width="240" height="58" rx="8" ry="8" fill="#DEEAF6" stroke="#1F3864" stroke-width="1.6" opacity="1.0"/><text x="140" y="95" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="14" fill="#1F3864" font-weight="bold" text-anchor="middle">Portero</text><line x1="140" y1="128" x2="140" y2="900" stroke="#9AA5B1" stroke-width="1.4" stroke-dasharray="6 5"/><rect x="300" y="70" width="240" height="58" rx="8" ry="8" fill="#DEEAF6" stroke="#1F3864" stroke-width="1.6" opacity="1.0"/><text x="420" y="95" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="14" fill="#1F3864" font-weight="bold" text-anchor="middle">EscanerScreen</text><text x="420" y="114" font-family="DejaVu Sans, Verdana, sans-serif" font-size="11" fill="#444444" font-weight="normal" text-anchor="middle">Compose</text><line x1="420" y1="128" x2="420" y2="900" stroke="#9AA5B1" stroke-width="1.4" stroke-dasharray="6 5"/><rect x="600" y="70" width="240" height="58" rx="8" ry="8" fill="#DEEAF6" stroke="#1F3864" stroke-width="1.6" opacity="1.0"/><text x="720" y="95" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="14" fill="#1F3864" font-weight="bold" text-anchor="middle">EscanerViewModel</text><text x="720" y="114" font-family="DejaVu Sans, Verdana, sans-serif" font-size="11" fill="#444444" font-weight="normal" text-anchor="middle">StateFlow</text><line x1="720" y1="128" x2="720" y2="900" stroke="#9AA5B1" stroke-width="1.4" stroke-dasharray="6 5"/><rect x="890" y="70" width="240" height="58" rx="8" ry="8" fill="#DEEAF6" stroke="#1F3864" stroke-width="1.6" opacity="1.0"/><text x="1010" y="95" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="14" fill="#1F3864" font-weight="bold" text-anchor="middle">RegistrarAcceso</text><text x="1010" y="114" font-family="DejaVu Sans, Verdana, sans-serif" font-size="11" fill="#444444" font-weight="normal" text-anchor="middle">UseCase</text><line x1="1010" y1="128" x2="1010" y2="900" stroke="#9AA5B1" stroke-width="1.4" stroke-dasharray="6 5"/><rect x="1170" y="70" width="240" height="58" rx="8" ry="8" fill="#DEEAF6" stroke="#1F3864" stroke-width="1.6" opacity="1.0"/><text x="1290" y="95" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="14" fill="#1F3864" font-weight="bold" text-anchor="middle">Room</text><text x="1290" y="114" font-family="DejaVu Sans, Verdana, sans-serif" font-size="11" fill="#444444" font-weight="normal" text-anchor="middle">DAO + @Transaction</text><line x1="1290" y1="128" x2="1290" y2="900" stroke="#9AA5B1" stroke-width="1.4" stroke-dasharray="6 5"/><line x1="170" y1="140" x2="420" y2="140" stroke="#1F3864" stroke-width="1.8" marker-end="url(#ar-azul)"/><text x="295.0" y="130" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12" fill="#1F3864" font-weight="normal" text-anchor="middle">1. Apunta la cámara al QR</text><line x1="420" y1="190" x2="720" y2="190" stroke="#1F3864" stroke-width="1.8" marker-end="url(#ar-azul)"/><text x="570.0" y="180" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12" fill="#1F3864" font-weight="normal" text-anchor="middle">2. alEscanear(textoQr) — CameraX + ML Kit</text><line x1="720" y1="240" x2="1010" y2="240" stroke="#1F3864" stroke-width="1.8" marker-end="url(#ar-azul)"/><text x="865.0" y="230" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12" fill="#1F3864" font-weight="normal" text-anchor="middle">3. invoke(texto, eventoActivo, puerta, operadorId)</text><line x1="1010" y1="300" x2="1290" y2="300" stroke="#A65B00" stroke-width="1.8" marker-end="url(#ar-naranja)"/><text x="1150.0" y="290" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12" fill="#A65B00" font-weight="normal" text-anchor="middle">4. consulta la entrada por código (índice único)</text><line x1="1290" y1="350" x2="1010" y2="350" stroke="#A65B00" stroke-width="1.8" marker-end="url(#ar-naranja)"/><text x="1150.0" y="340" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12" fill="#A65B00" font-weight="normal" text-anchor="middle">5. entrada + conteo de ingresos del evento</text><rect x="700" y="380" width="640" height="150" rx="10" ry="10" fill="#F7F9FC" stroke="#1F3864" stroke-width="1.6" opacity="1.0"/><text x="720" y="406" font-family="DejaVu Sans, Verdana, sans-serif" font-size="13" fill="#1F3864" font-weight="bold" text-anchor="start">6. Validaciones en orden (dominio)</text><text x="720" y="428" font-family="DejaVu Sans, Verdana, sans-serif" font-size="11.5" fill="#1A1A1A" font-weight="normal" text-anchor="start">formato RE|1|código|firma → HMAC-SHA256 coincide</text><text x="720" y="447" font-family="DejaVu Sans, Verdana, sans-serif" font-size="11.5" fill="#1A1A1A" font-weight="normal" text-anchor="start">entrada existe · pertenece al evento activo · estado</text><text x="720" y="466" font-family="DejaVu Sans, Verdana, sans-serif" font-size="11.5" fill="#1A1A1A" font-weight="normal" text-anchor="start">aforo: COUNT(PERMITIDO) &lt; aforo_maximo · evento no cancelado</text><line x1="720" y1="540" x2="1290" y2="540" stroke="#1E6B34" stroke-width="2" marker-end="url(#ar-verde)"/><text x="1005" y="532" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12" fill="#1E6B34" font-weight="normal" text-anchor="middle">7. transacción atómica: estado → USADA, usada_en, INSERT del registro</text><rect x="700" y="570" width="640" height="120" rx="10" ry="10" fill="#E3F4E7" stroke="#1E6B34" stroke-width="1.6" opacity="1.0"/><text x="1020" y="596" font-family="DejaVu Sans, Verdana, sans-serif" font-size="15" fill="#1E6B34" font-weight="bold" text-anchor="middle">PERMITIDO</text><text x="720" y="622" font-family="DejaVu Sans, Verdana, sans-serif" font-size="11.5" fill="#1A1A1A" font-weight="normal" text-anchor="start">Entrada VÁLIDA → USADA · se inserta el registro con resultado PERMITIDO</text><text x="720" y="641" font-family="DejaVu Sans, Verdana, sans-serif" font-size="11.5" fill="#1A1A1A" font-weight="normal" text-anchor="start">Se muestran asistente y tipo de entrada · el aforo consumido sube en 1</text><rect x="60" y="570" width="600" height="220" rx="10" ry="10" fill="#FCE4E2" stroke="#B3261E" stroke-width="1.6" opacity="1.0"/><text x="360" y="596" font-family="DejaVu Sans, Verdana, sans-serif" font-size="13" fill="#B3261E" font-weight="bold" text-anchor="middle">RECHAZADO (la entrada NO se quema, salvo si ya estaba usada)</text><text x="80" y="622" font-family="DejaVu Sans, Verdana, sans-serif" font-size="11.5" fill="#1A1A1A" font-weight="normal" text-anchor="start">FIRMA_INVALIDA  · el QR es de otro dispositivo o inventado</text><text x="80" y="643" font-family="DejaVu Sans, Verdana, sans-serif" font-size="11.5" fill="#1A1A1A" font-weight="normal" text-anchor="start">NO_EXISTE       · el código no está en esta base de datos</text><text x="80" y="664" font-family="DejaVu Sans, Verdana, sans-serif" font-size="11.5" fill="#1A1A1A" font-weight="normal" text-anchor="start">OTRO_EVENTO     · la entrada pertenece a otro evento</text><text x="80" y="685" font-family="DejaVu Sans, Verdana, sans-serif" font-size="11.5" fill="#1A1A1A" font-weight="normal" text-anchor="start">YA_USADA        · ya ingresó (se muestra la hora del ingreso)</text><text x="80" y="706" font-family="DejaVu Sans, Verdana, sans-serif" font-size="11.5" fill="#1A1A1A" font-weight="normal" text-anchor="start">ANULADA         · la entrada fue anulada por el administrador</text><text x="80" y="727" font-family="DejaVu Sans, Verdana, sans-serif" font-size="11.5" fill="#1A1A1A" font-weight="normal" text-anchor="start">AFORO_LLENO     · queda VÁLIDA y puede autorizarse excepción</text><text x="80" y="748" font-family="DejaVu Sans, Verdana, sans-serif" font-size="11.5" fill="#1A1A1A" font-weight="normal" text-anchor="start">EVENTO_CANCELADO· el evento no admite ingresos</text><line x1="720" y1="700" x2="420" y2="700" stroke="#B3261E" stroke-width="1.8" marker-end="url(#ar-rojo)"/><text x="570" y="692" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12" fill="#B3261E" font-weight="normal" text-anchor="middle">8. se registra el intento (RN-08, RNF-17)</text><line x1="1010" y1="780" x2="720" y2="780" stroke="#1F3864" stroke-width="1.8" marker-end="url(#ar-azul)"/><text x="865" y="772" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12" fill="#1F3864" font-weight="normal" text-anchor="middle">UiState con el resultado</text><rect x="60" y="820" width="1280" height="90" rx="10" ry="10" fill="#F7F9FC" stroke="#1F3864" stroke-width="1.6" opacity="1.0"/><line x1="140" y1="850" x2="420" y2="850" stroke="#1E6B34" stroke-width="2" marker-end="url(#ar-verde)"/><text x="160" y="842" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12" fill="#1E6B34" font-weight="normal" text-anchor="start">verde: icono + PERMITIDO + sonido</text><line x1="420" y1="885" x2="140" y2="885" stroke="#B3261E" stroke-width="2" marker-end="url(#ar-rojo)"/><text x="160" y="877" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12" fill="#B3261E" font-weight="normal" text-anchor="start">rojo: icono + motivo + vibración</text><text x="1120" y="866" font-family="DejaVu Sans, Verdana, sans-serif" font-size="11.5" fill="#1F3864" font-weight="normal" text-anchor="middle">Todo el paso 6 y el 7 ocurren en una sola transacción: dos escaneos del mismo código no pueden registrar dos ingresos.</text></svg>